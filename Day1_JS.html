<!DOCTYPE html>
<html>
<head>
    <title>Store Sales</title>
</head>

<body>

<script>
    let tshirtQuantity = 5;
    let tshirtPrice = 400;

    let capQuantity = 3;
    let capPrice = 150;

    let totalEarnings = (tshirtQuantity * tshirtPrice) + (capQuantity * capPrice);

    console.log("Total earnings: ₹" + totalEarnings);

    tshirtPrice = 450;

    totalEarnings = (tshirtQuantity * tshirtPrice) + (capQuantity * capPrice);

    console.log("Updated total earnings: ₹" + totalEarnings);
</script>

</body>
</html>
