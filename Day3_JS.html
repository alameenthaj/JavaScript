<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h2 id="demo"></h2>
    <script>
        let feedback = "   I loved the FOOD and the service!   ";
        feedback = feedback.trim();
        feedback = feedback.toLowerCase();
        feedback = feedback.replace("FOOD","ambience");
        
        let position=feedback.indexOf("service");
        let words = feedback.split(" ");

        document.getElementById("demo").innerHTML = feedback + "<br>" + position + "<br>" + words ;
    </script>
</body>
</html>
