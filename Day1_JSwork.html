<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery</title>
</head>

<body>

<script>
    // Item names
    let riceName = "Rice";
    let sugarName = "Sugar";
    let wheatName = "Wheat";

    // Prices
    let ricePrice = 60;
    let sugarPrice = 50;
    let wheatPrice = 40;

    // Quantities
    let riceQuantity = 2;
    let sugarQuantity = 3;
    let wheatQuantity = 4;

    // Cost of each item
    let riceCost = ricePrice * riceQuantity;
    let sugarCost = sugarPrice * sugarQuantity;
    let wheatCost = wheatPrice * wheatQuantity;

    console.log(riceName + " cost: ₹" + riceCost);
    console.log(sugarName + " cost: ₹" + sugarCost);
    console.log(wheatName + " cost: ₹" + wheatCost);

    // Calculate total bill
    let totalBill = riceCost + sugarCost + wheatCost;

    console.log("Total bill: ₹" + totalBill);

    // Change quantity of one item
    riceQuantity = 5;

    // Recalculate rice cost
    riceCost = ricePrice * riceQuantity;

    // Recalculate total bill
    totalBill = riceCost + sugarCost + wheatCost;

    console.log("Updated total bill: ₹" + totalBill);
</script>

</body>
</html>
